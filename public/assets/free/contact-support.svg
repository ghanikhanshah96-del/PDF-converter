<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
  <title id="title">Contact and support illustration</title>
  <desc id="desc">Envelope, chat messages, and support headset representing getting in touch with our team.</desc>
  <rect width="640" height="480" fill="#fff5f5"/>
  <!-- soft blobs -->
  <circle cx="92" cy="86" r="64" fill="#ffe0e0"/>
  <circle cx="560" cy="390" r="78" fill="#eef5ff"/>
  <circle cx="520" cy="70" r="36" fill="#fff0c8"/>

  <!-- envelope -->
  <g transform="translate(70 150)">
    <rect x="0" y="48" width="260" height="170" rx="18" fill="#ffffff" stroke="#f0caca" stroke-width="3"/>
    <path d="M8 56 L130 150 L252 56" fill="none" stroke="#e5322d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 200 L100 130" fill="none" stroke="#ffc4c4" stroke-width="5" stroke-linecap="round"/>
    <path d="M242 200 L160 130" fill="none" stroke="#ffc4c4" stroke-width="5" stroke-linecap="round"/>
    <circle cx="220" cy="40" r="28" fill="#e5322d"/>
    <path d="M210 40h20M220 30v20" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- chat bubbles -->
  <g transform="translate(360 90)">
    <rect x="0" y="20" width="200" height="96" rx="22" fill="#ffffff" stroke="#dde5f2" stroke-width="3"/>
    <path d="M36 116 l18 -18 h20" fill="#ffffff" stroke="#dde5f2" stroke-width="3"/>
    <rect x="24" y="44" width="110" height="12" rx="6" fill="#cad7ea"/>
    <rect x="24" y="72" width="78" height="12" rx="6" fill="#e7eef8"/>

    <rect x="40" y="150" width="190" height="96" rx="22" fill="#e5322d"/>
    <path d="M186 246 l-18 -18 h-20" fill="#e5322d"/>
    <rect x="64" y="174" width="120" height="12" rx="6" fill="#ffc4c4"/>
    <rect x="64" y="202" width="86" height="12" rx="6" fill="#ffd8d8"/>
  </g>

  <!-- headset / support -->
  <g transform="translate(400 300)">
    <path d="M40 70c0-44 28-70 70-70s70 26 70 70" fill="none" stroke="#33333b" stroke-width="12" stroke-linecap="round"/>
    <rect x="18" y="64" width="36" height="58" rx="14" fill="#4f7bd9"/>
    <rect x="156" y="64" width="36" height="58" rx="14" fill="#4f7bd9"/>
    <path d="M192 100c18 6 28 22 28 42" fill="none" stroke="#78b957" stroke-width="8" stroke-linecap="round"/>
    <circle cx="220" cy="158" r="14" fill="#78b957"/>
  </g>

  <!-- caption chip -->
  <rect x="48" y="400" width="220" height="44" rx="22" fill="#ffffff" stroke="#ffd3d3"/>
  <circle cx="78" cy="422" r="12" fill="#e5322d"/>
  <path d="M72 422h12M78 416v12" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="102" y="412" width="140" height="10" rx="5" fill="#f6b4b4"/>
  <rect x="102" y="428" width="96" height="8" rx="4" fill="#ffe0e0"/>
</svg>
