  <rect x="670" y="145" width="100" height="130" rx="12" fill="#fff0f0" stroke="#e5322d" stroke-width="2"/>
  <text x="695" y="220" fill="#c82420" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">PDF</text>
  <polygon points="800,205 840,188 840,222" fill="#e5322d"/>
  <rect x="860" y="145" width="140" height="130" rx="12" fill="#ffffff" stroke="#e5322d" stroke-width="2"/>
