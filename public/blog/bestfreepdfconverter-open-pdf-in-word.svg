  <text x="335" y="305" fill="#2b579a" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600">Editable text</text>
  <text x="80" y="360" fill="#33333b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600">File - Open - choose your PDF</text>
  <text x="80" y="395" fill="#707078" font-family="Arial, Helvetica, sans-serif" font-size="15">Original PDF stays unchanged on your device.</text>
  <rect x="620" y="40" width="540" height="400" rx="14" fill="#ffffff" stroke="#e7e7ee" stroke-width="2"/>
