<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="525" viewBox="0 0 1200 525" role="img" aria-labelledby="title desc">
  <title id="title">Open a PDF in Word or convert it to DOCX first</title>
  <desc id="desc">Two paths: open PDF with File Open in Microsoft Word, or convert PDF to Word online then open the DOCX.</desc>
  <rect width="1200" height="525" rx="18" fill="#f7f7fb"/>
  <rect x="40" y="40" width="540" height="400" rx="14" fill="#ffffff" stroke="#e7e7ee" stroke-width="2"/>
