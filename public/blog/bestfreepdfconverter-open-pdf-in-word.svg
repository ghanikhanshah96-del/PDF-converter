  <rect x="80" y="140" width="120" height="150" rx="12" fill="#fff0f0" stroke="#e5322d" stroke-width="2"/>
  <text x="110" y="225" fill="#c82420" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">PDF</text>
  <polygon points="240,210 285,190 285,230" fill="#e5322d"/>
