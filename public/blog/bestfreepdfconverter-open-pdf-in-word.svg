  <text x="660" y="360" fill="#33333b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600">Download DOCX then open in Word</text>
  <text x="660" y="395" fill="#707078" font-family="Arial, Helvetica, sans-serif" font-size="15">Review layout before you edit or share.</text>
