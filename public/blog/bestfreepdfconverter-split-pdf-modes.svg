<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">One selected range can become one PDF or a ZIP of single pages</title>
  <desc id="desc">Illustration of a page range 1-3, 5 saved either as one PDF or as separate page files inside a ZIP. This is not a screenshot of the tool.</desc>
  <rect width="960" height="420" rx="16" fill="#f7f7fb"/>
  <rect x="36" y="48" width="250" height="324" rx="12" fill="#ffffff" stroke="#e7e7ee"/>
  <rect x="36" y="48" width="250" height="52" rx="12" fill="#fff0f0"/>
  <rect x="36" y="88" width="250" height="12" fill="#fff0f0"/>
  <text x="56" y="82" fill="#c82420" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Page range</text>
  <rect x="64" y="128" width="194" height="40" rx="8" fill="#ffffff" stroke="#e5322d"/>
  <text x="78" y="154" fill="#33333b" font-family="Consolas, monospace" font-size="16">1-3, 5</text>
  <text x="64" y="204" fill="#33333b" font-family="Segoe UI, sans-serif" font-size="14">Pages kept: 1, 2, 3, 5</text>
  <text x="64" y="232" fill="#707078" font-family="Segoe UI, sans-serif" font-size="13">Always written in</text>
  <text x="64" y="252" fill="#707078" font-family="Segoe UI, sans-serif" font-size="13">ascending order.</text>
  <text x="64" y="292" fill="#707078" font-family="Segoe UI, sans-serif" font-size="13">Empty box = every page.</text>
  <text x="64" y="328" fill="#707078" font-family="Segoe UI, sans-serif" font-size="13">Original file is not edited.</text>
  <polygon points="310,200 348,184 348,216" fill="#e5322d"/>
  <rect x="372" y="48" width="252" height="148" rx="12" fill="#ffffff" stroke="#e7e7ee"/>
  <text x="392" y="82" fill="#c82420" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">One PDF</text>
  <text x="392" y="112" fill="#33333b" font-family="Segoe UI, sans-serif" font-size="14">report-split.pdf</text>
  <text x="392" y="140" fill="#707078" font-family="Segoe UI, sans-serif" font-size="13">Pages 1, 2, 3, and 5</text>
  <text x="392" y="162" fill="#707078" font-family="Segoe UI, sans-serif" font-size="13">stay in one file.</text>
  <rect x="372" y="216" width="252" height="156" rx="12" fill="#ffffff" stroke="#e7e7ee"/>
  <text x="392" y="250" fill="#c82420" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Separate pages</text>
  <text x="392" y="280" fill="#33333b" font-family="Segoe UI, sans-serif" font-size="14">report-pages.zip</text>
  <text x="392" y="308" fill="#707078" font-family="Segoe UI, sans-serif" font-size="13">page-1.pdf  page-2.pdf</text>
  <text x="392" y="330" fill="#707078" font-family="Segoe UI, sans-serif" font-size="13">page-3.pdf  page-5.pdf</text>
  <rect x="660" y="48" width="264" height="324" rx="12" fill="#ffffff" stroke="#e7e7ee"/>
  <rect x="660" y="48" width="264" height="52" rx="12" fill="#fff0f0"/>
  <rect x="660" y="88" width="264" height="12" fill="#fff0f0"/>
  <text x="680" y="82" fill="#c82420" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Two parts</text>
  <text x="680" y="132" fill="#33333b" font-family="Segoe UI, sans-serif" font-size="14">Run 1: 1-10</text>
  <text x="680" y="156" fill="#707078" font-family="Segoe UI, sans-serif" font-size="13">One PDF, then rename it.</text>
  <text x="680" y="196" fill="#33333b" font-family="Segoe UI, sans-serif" font-size="14">Run 2: 11-20</text>
  <text x="680" y="220" fill="#707078" font-family="Segoe UI, sans-serif" font-size="13">One PDF, then rename it.</text>
  <text x="680" y="268" fill="#707078" font-family="Segoe UI, sans-serif" font-size="13">One click cannot make two</text>
  <text x="680" y="288" fill="#707078" font-family="Segoe UI, sans-serif" font-size="13">grouped multi-page PDFs.</text>
  <text x="680" y="328" fill="#707078" font-family="Segoe UI, sans-serif" font-size="13">Illustration, not a screenshot.</text>
</svg>
