<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="525" viewBox="0 0 1200 525" role="img" aria-labelledby="title desc">
  <title id="title">What compressing a PDF does</title>
  <desc id="desc">A large PDF is reduced by optimizing images, compressing data, and removing extra information, then saved as a smaller PDF.</desc>
  <rect width="1200" height="525" rx="18" fill="#f7f7fb"/>
  <rect x="40" y="50" width="220" height="280" rx="14" fill="#ffffff" stroke="#e5322d" stroke-width="2"/>
  <rect x="40" y="50" width="220" height="48" rx="14" fill="#fff0f0"/>
  <rect x="40" y="82" width="220" height="16" fill="#fff0f0"/>
  <text x="78" y="84" fill="#c82420" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Large PDF</text>
  <rect x="72" y="130" width="156" height="90" rx="8" fill="#fff0f0" stroke="#e5322d" stroke-width="2"/>
  <text x="118" y="184" fill="#c82420" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">PDF</text>
  <text x="72" y="260" fill="#33333b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600">High-resolution</text>
  <text x="72" y="284" fill="#707078" font-family="Arial, Helvetica, sans-serif" font-size="14">photos and extra data</text>
  <polygon points="290,185 330,168 330,202" fill="#e5322d"/>
  <rect x="350" y="50" width="500" height="280" rx="14" fill="#ffffff" stroke="#e7e7ee" stroke-width="2"/>
  <rect x="350" y="50" width="500" height="48" rx="14" fill="#fff0f0"/>
  <rect x="350" y="82" width="500" height="16" fill="#fff0f0"/>
  <text x="370" y="84" fill="#c82420" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">What compression changes</text>
  <rect x="378" y="130" width="140" height="150" rx="10" fill="#fff0f0" stroke="#e5322d" stroke-width="2"/>
  <text x="400" y="198" fill="#c82420" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Images</text>
  <text x="394" y="226" fill="#707078" font-family="Arial, Helvetica, sans-serif" font-size="13">Lower extra</text>
  <text x="400" y="246" fill="#707078" font-family="Arial, Helvetica, sans-serif" font-size="13">resolution</text>
  <rect x="530" y="130" width="140" height="150" rx="10" fill="#ffffff" stroke="#e5322d" stroke-width="2"/>
  <text x="560" y="198" fill="#c82420" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Data</text>
  <text x="548" y="226" fill="#707078" font-family="Arial, Helvetica, sans-serif" font-size="13">Store more</text>
  <text x="546" y="246" fill="#707078" font-family="Arial, Helvetica, sans-serif" font-size="13">efficiently</text>
  <rect x="682" y="130" width="140" height="150" rx="10" fill="#ffffff" stroke="#1f7a4d" stroke-width="2"/>
  <text x="708" y="198" fill="#1f7a4d" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Extras</text>
  <text x="700" y="226" fill="#707078" font-family="Arial, Helvetica, sans-serif" font-size="13">Remove unused</text>
  <text x="718" y="246" fill="#707078" font-family="Arial, Helvetica, sans-serif" font-size="13">data</text>
  <polygon points="880,185 920,168 920,202" fill="#e5322d"/>
  <rect x="940" y="70" width="220" height="240" rx="14" fill="#ffffff" stroke="#1f7a4d" stroke-width="2"/>
  <rect x="940" y="70" width="220" height="48" rx="14" fill="#eef8f2"/>
  <rect x="940" y="102" width="220" height="16" fill="#eef8f2"/>
  <text x="978" y="104" fill="#1f7a4d" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Smaller PDF</text>
  <rect x="990" y="150" width="120" height="80" rx="8" fill="#ffffff" stroke="#1f7a4d" stroke-width="2"/>
  <text x="1022" y="198" fill="#1f7a4d" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">PDF</text>
  <text x="972" y="268" fill="#33333b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600">Easier to email</text>
  <text x="972" y="292" fill="#707078" font-family="Arial, Helvetica, sans-serif" font-size="14">Original file stays intact</text>
  <text x="40" y="390" fill="#33333b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600">High, Medium, or Low quality changes how much image detail is kept.</text>
  <text x="40" y="420" fill="#707078" font-family="Arial, Helvetica, sans-serif" font-size="15">Already-optimized PDFs may shrink only a little. Always review the result.</text>
  <text x="40" y="490" fill="#707078" font-family="Arial, Helvetica, sans-serif" font-size="14">BestFreePDFConverter illustration - topic guide, not a screenshot.</text>
</svg>
