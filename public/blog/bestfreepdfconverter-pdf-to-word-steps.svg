<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Convert PDF to Word in four clear steps</title>
  <desc id="desc">Select a PDF, convert in the browser, download a DOCX file, then open and edit it in Word.</desc>
  <rect width="1200" height="420" rx="18" fill="#f7f7fb"/>
  <rect x="36" y="36" width="260" height="300" rx="14" fill="#ffffff" stroke="#e7e7ee" stroke-width="2"/>
  <circle cx="70" cy="78" r="22" fill="#e5322d"/>
  <text x="63" y="86" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">1</text>
  <text x="105" y="86" fill="#33333b" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Select PDF</text>
  <rect x="78" y="130" width="176" height="140" rx="12" fill="#fff0f0" stroke="#e5322d" stroke-width="2"/>
  <text x="130" y="210" fill="#c82420" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">PDF</text>
  <text x="70" y="310" fill="#707078" font-family="Arial, Helvetica, sans-serif" font-size="15">Up to 50 MB each</text>
  <polygon points="310,186 348,168 348,204" fill="#e5322d"/>
  <rect x="362" y="36" width="260" height="300" rx="14" fill="#ffffff" stroke="#e7e7ee" stroke-width="2"/>
  <circle cx="396" cy="78" r="22" fill="#e5322d"/>
  <text x="389" y="86" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">2</text>
  <text x="431" y="86" fill="#33333b" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Convert</text>
  <rect x="402" y="130" width="180" height="140" rx="12" fill="#ffffff" stroke="#e7e7ee" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="430" y="185" fill="#33333b" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">In your browser</text>
  <text x="448" y="215" fill="#707078" font-family="Arial, Helvetica, sans-serif" font-size="14">No upload server</text>
  <rect x="432" y="235" width="120" height="22" rx="11" fill="#e5322d"/>
  <text x="452" y="251" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Convert</text>
  <text x="400" y="310" fill="#707078" font-family="Arial, Helvetica, sans-serif" font-size="15">PDF to Word tool</text>
  <polygon points="636,186 674,168 674,204" fill="#e5322d"/>
  <rect x="688" y="36" width="230" height="300" rx="14" fill="#ffffff" stroke="#e7e7ee" stroke-width="2"/>
  <circle cx="722" cy="78" r="22" fill="#e5322d"/>
  <text x="715" y="86" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">3</text>
  <text x="757" y="86" fill="#33333b" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Download</text>
  <rect x="738" y="140" width="130" height="150" rx="12" fill="#ffffff" stroke="#2b579a" stroke-width="2"/>
  <rect x="738" y="140" width="130" height="36" rx="12" fill="#2b579a"/>
  <text x="762" y="164" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">DOCX</text>
  <rect x="758" y="200" width="90" height="10" rx="3" fill="#33333b"/>
  <rect x="758" y="220" width="75" height="8" rx="2" fill="#c8c8d2"/>
  <rect x="758" y="238" width="80" height="8" rx="2" fill="#c8c8d2"/>
  <text x="720" y="320" fill="#707078" font-family="Arial, Helvetica, sans-serif" font-size="15">Save the Word file</text>
  <polygon points="932,186 970,168 970,204" fill="#e5322d"/>
  <rect x="984" y="36" width="180" height="300" rx="14" fill="#ffffff" stroke="#e7e7ee" stroke-width="2"/>
  <circle cx="1018" cy="78" r="22" fill="#e5322d"/>
  <text x="1011" y="86" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">4</text>
  <text x="1050" y="86" fill="#33333b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Edit</text>
  <rect x="1015" y="140" width="120" height="150" rx="12" fill="#ffffff" stroke="#2b579a" stroke-width="2"/>
  <rect x="1030" y="170" width="90" height="10" rx="3" fill="#33333b"/>
  <rect x="1030" y="192" width="70" height="8" rx="2" fill="#c8c8d2"/>
  <rect x="1030" y="212" width="80" height="8" rx="2" fill="#c8c8d2"/>
  <rect x="1030" y="240" width="55" height="24" rx="6" fill="#e5322d"/>
  <text x="1040" y="257" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Word</text>
  <text x="1010" y="320" fill="#707078" font-family="Arial, Helvetica, sans-serif" font-size="15">Open and review</text>
  <text x="36" y="380" fill="#707078" font-family="Arial, Helvetica, sans-serif" font-size="14">Clear vector steps for PDF to Word - stays sharp on every screen size.</text>
</svg>
